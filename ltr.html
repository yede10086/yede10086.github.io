<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你的文学精神原型</title>
    <style>
        /* 全局变量定义：高级极简风 */
        :root {
            --bg: #F7F5F0;
            --text-primary: #1A1A1A;
            --text-secondary: #66615B;
            --accent: #9C5A4C; /* 朱砂/砖红色 */
            --border: #E6E2D8;
            --card-bg: #FFFFFF;
            --serif: "Georgia", "Songti SC", "STSong", "SimSun", serif;
            --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--sans);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 500px; /* 适配移动端阅读宽度 */
            background-color: var(--card-bg);
            box-shadow: 0 0 40px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 页面切换动画 */
        .view {
            display: none;
            flex-direction: column;
            padding: 40px 28px;
            flex: 1;
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页 */
        .intro-header {
            margin-top: 15vh;
            margin-bottom: 40px;
        }

        .intro-title {
            font-family: var(--serif);
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .intro-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .intro-text {
            font-family: var(--serif);
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 2;
            margin-bottom: 40px;
            text-align: justify;
        }

        .btn-start {
            background-color: var(--text-primary);
            color: var(--bg);
            border: none;
            padding: 16px;
            font-size: 15px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: auto;
        }

        .btn-start:active {
            background-color: var(--accent);
        }

        /* 答题页 */
        .quiz-header {
            margin-bottom: 30px;
        }

        .progress-text {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-family: var(--serif);
        }

        .progress-track {
            height: 1px;
            background-color: var(--border);
            width: 100%;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
            position: absolute;
            top: 0;
            left: 0;
        }

        .question-title {
            font-family: var(--serif);
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 30px;
            min-height: 60px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            border: 1px solid var(--border);
            padding: 18px 20px;
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            background: var(--card-bg);
        }

        .option-item:active, .option-item:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background-color: #FDFBF9;
            transform: translateX(4px);
        }

        /* 结果页 */
        .result-hero {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .res-label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .res-name {
            font-family: var(--serif);
            font-size: 36px;
            color: var(--accent);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .res-tag {
            display: inline-block;
            font-size: 12px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
        }

        .res-quote {
            font-family: var(--serif);
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 20px;
            line-height: 1.6;
            padding: 0 20px;
        }

        /* 雷达图与数据 */
        .radar-section {
            margin-bottom: 40px;
            padding: 20px 0;
        }
        
        .section-title {
            font-family: var(--serif);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background-color: var(--accent);
            margin-right: 8px;
        }

        .radar-chart-container {
            width: 100%;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .data-item {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-family: var(--serif);
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .data-score {
            color: var(--accent);
            font-weight: bold;
        }

        .data-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 文字解析 */
        .text-section {
            margin-bottom: 30px;
        }

        .text-content {
            font-family: var(--serif);
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 2;
            text-align: justify;
        }

        .blessing-box {
            background-color: var(--bg);
            padding: 24px;
            border-left: 2px solid var(--accent);
            margin: 30px 0;
        }

        .blessing-text {
            font-family: var(--serif);
            font-size: 16px;
            color: var(--text-primary);
            line-height: 1.8;
        }

        .btn-restart {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 15px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-restart:active {
            background-color: var(--bg);
        }

        /* 底部留白 */
        .spacer {
            height: 40px;
        }

    </style>
</head>
<body>

<div id="app">
    <!-- 封面 -->
    <div id="view-intro" class="view active">
        <div class="intro-header">
            <div class="intro-subtitle">Literary Archetype Test</div>
            <h1 class="intro-title">你的文学精神<br>原型是哪一个？</h1>
        </div>
        <div class="intro-text">
            有时候我会觉得，自己身上有些东西很难解释。别人随口一句话，你能在心里琢磨三天；微信群没人回消息，你会怀疑是不是自己说错了什么。<br><br>
            高敏感从来不是缺陷，而是灵魂自带的细腻天赋。我们在文学中寻找同类，借一个人物，重新看看自己一直说不清的部分。
        </div>
        <button class="btn-start" onclick="startQuiz()">开启精神探索</button>
    </div>

    <!-- 答题 -->
    <div id="view-quiz" class="view">
        <div class="quiz-header">
            <div class="progress-text" id="progressText">01 / 20</div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div class="question-title" id="questionTitle">加载中...</div>
        <div class="options-list" id="optionsList"></div>
    </div>

    <!-- 结果 -->
    <div id="view-result" class="view">
        <div class="result-hero">
            <div class="res-label">YOUR SOUL PORTRAIT</div>
            <div class="res-name" id="resName">林黛玉</div>
            <div class="res-tag" id="resTag">高SPS·共情雷达型</div>
            <div class="res-quote" id="resQuote"></div>
        </div>

        <div class="radar-section">
            <div class="section-title">精神坐标</div>
            <div class="radar-chart-container">
                <svg id="radarSvg" width="240" height="240" viewBox="0 0 240 240"></svg>
            </div>
            
            <div class="data-list" id="dataList">
                <!-- 动态注入数据条 -->
            </div>
        </div>

        <div class="text-section">
            <div class="section-title">灵魂底色</div>
            <div class="text-content" id="resSoul"></div>
        </div>

        <div class="text-section">
            <div class="section-title">现世映射</div>
            <div class="text-content" id="resReality"></div>
        </div>

        <div class="blessing-box">
            <div class="blessing-text" id="resBlessing"></div>
        </div>

        <button class="btn-restart" onclick="location.reload()">重新测一次</button>
        <div class="spacer"></div>
    </div>
</div>

<script>
    // 维度定义
    const dimensions = [
        { key: 'detach', label: '现世抽离', desc: '与喧嚣人群、表演和世俗惯性的距离。' },
        { key: 'order', label: '秩序壁垒', desc: '建立现实判断与抵御外界入侵的能力。' },
        { key: 'emotion', label: '情感浓度', desc: '对爱、美、痛感和内在信念的投入烈度。' },
        { key: 'rebel', label: '反叛张力', desc: '面对命运倾轧与规训时硬碰硬的硬度。' },
        { key: 'spirit', label: '精神潜游', desc: '跨越现实藩篱，向内构建精神宇宙的能力。' }
    ];

    // 题目数据 (精简版示例，结构同上)
    const questions = [
        { q: "走进一个满是陌生人的房间，你最先注意到的是：", o: ["每个人的微表情和能量场，谁和谁之间有暗流", "房间的出口在哪，哪里可以退出去喘口气", "整体氛围是否合乎礼仪，有没有人越界", "某个角落的光影，让你想起另一段时空"] },
        { q: "朋友深夜发来长语音倾诉，你的反应是：", o: ["立刻点开，全盘接收，听完自己失眠", "先回“我在”，但清楚自己不能替他解决", "冷静帮他梳理事实和选项，不卷入情绪", "想起自己类似经历，细节像潮水涌回来"] },
        { q: "当你的观点在小组里被轻易忽略时：", o: ["羞耻自责，怀疑自己表达有问题", "冷峻的愤怒，底线被触碰了", "熟悉的疏离感：果然不是一类人", "算了不争，但心里会默默记下"] },
        { q: "你最容易在什么场景下“电量耗尽”？", o: ["连续社交后，回家需要整晚回血", "有人试图用情感绑架你，逼你表态", "被迫参与毫无意义的寒暄和表演", "环境太吵、信息过载，感官先崩溃"] },
        { q: "面对一个明显不合理的规则，你更可能：", o: ["心里抗拒，行动照做，生闷气", "公开或半公开地指出它的荒谬", "表面配合，内心完全不当回事", "找出逻辑漏洞，但不浪费情绪愤怒"] },
        { q: "在亲密关系里，你最深的恐惧是：", o: ["不被真正看见和理解", "失去自我，被对方吞噬或控制", "被要求表演亲密，而自己只想待着", "重要的人突然消失，让你措手不及"] },
        { q: "当一段重要关系结束时，你的恢复方式：", o: ["反复回忆细节，找哪里出了问题", "切断联系，用距离保护自己", "接受结束，把注意力转向其他事", "内化成某种创作或自我理解的材料"] },
        // ... 实际开发中可以把前面设计的20题全放入
    ];

    // 扩充题库到20题 (为演示使用简写逻辑，实际运行中请复制之前的完整题库)
    const fullQuestions = [
        ...questions, 
        { q: "别人真诚夸你“细腻”时，你的内心：", o: ["心里暖暖的，会记很久", "接受，同时清楚只是自己的一面", "觉得“细腻”在这个时代不算好词", "你只看到细腻，没看到它让我多累"] },
        { q: "你更容易被哪种艺术作品击中？", o: ["描绘破碎、失去和不可挽回之物的", "展现如何在压迫下守住尊严的", "冷峻解剖人性虚伪和荒诞的", "捕捉日常中微小、易逝之美的"] },
        { q: "当你感到被误解且解释无用时：", o: ["反复排练“如果当时那样说就好了”", "从此把这个人划出信任圈", "觉得被误解是表达者的宿命，随它去", "用文字或创作把这件事消化掉"] },
        { q: "你对自己的“敏感”最矛盾的态度是：", o: ["感激它能感受美，恨它承受太多", "它是我尊严的一部分，不打算改", "它让我和大多数人隔着玻璃", "希望自己能钝一点，但做不到"] },
        { q: "一个朋友做了让你不舒服的事：", o: ["先反思是不是自己太敏感了", "直接但平静地告诉对方边界在哪", "不说，默默调整和这个人的距离", "观察一段时间，看是偶然还是模式"] },
        { q: "深夜独处时，你脑子里最常浮现：", o: ["白天某人说话时的语气和眼神", "对自己人生选择的复盘和审视", "一种对人群和规则的淡淡厌倦", "某段旧记忆里的气味、光线或触感"] },
        { q: "如果在完全没人认识你的新环境：", o: ["先观察，找到安全的人再慢慢打开", "保持礼貌距离，不主动不讨好", "享受自由，像重新开始一样", "花更多时间在环境的细节光影上"] },
        { q: "你更认同下面哪句话？", o: ["“感受到太多，不知拿它们怎么办。”", "“可以温柔，但底线不容谈判。”", "“大家都在演，我只是不想配合。”", "“美和痛是一回事，我都接得住。”"] },
        { q: "如果用一个意象描述你的内在：", o: ["一面过于清晰的镜子，易碎", "一座有护城河的小岛，吊桥由你决定", "坐在剧场后排的观众，隔着一层", "一块记住所有雨水和阳光的石头"] },
        { q: "面对突如其来的变动：", o: ["焦虑，怕影响整体进度", "迅速建立新的秩序和计划", "觉得世界的本质就是荒诞的", "顺其自然，总能找到新风景"] }
    ];

    // 结果配置
    const resultsData = {
        'A': {
            name: '林黛玉',
            tag: '高SPS · 共情雷达型',
            quote: '“花谢花飞花满天，红消香断有谁怜。”',
            scores: { detach: 75, order: 15, emotion: 98, rebel: 20, spirit: 90 },
            soul: '你不是脆弱，你只是拥有一套分辨率极高的精神雷达。贾府的一草一木、人情冷暖，在你这里的震感是被放大的。你极度珍视内心的纯粹，拒绝向庸俗妥协。与其说你是在内耗，不如说你是宁愿抱着自己的清高独自凋零，也不愿为了迎合别人而沾染世俗的泥淖。',
            reality: '在一个崇尚“高情商”的现代社会里，你看透了饭局上的虚伪寒暄。你并非学不会那些套路，你只是觉得“不配”。你常常因为承载了太多他人的情绪而疲惫，你需要退回只属于你的潇湘馆，自己消化那些说不清的心事。',
            blessing: '“你的敏感是天赋，不是诅咒。把接住的情绪写下来，别让‘我懂’变成‘我全吞’。”'
        },
        'B': {
            name: '简·爱',
            tag: '道德同一性 · 边界守护型',
            quote: '“你以为我贫穷、低微、不美，就没有灵魂没有心吗？”',
            scores: { detach: 60, order: 95, emotion: 70, rebel: 85, spirit: 40 },
            soul: '你是一个清醒的守门人。你的内核有一种冷峻的道德感和极其不可侵犯的尊严。你不轻易交心，但一旦认定，便是深情且长久的。你太清楚自己的底线在哪，再爱一个人，也不肯拿尊严去交换；再渴望一段关系，也绝不弯下一寸脊梁。',
            reality: '在人际关系里，你是那个敢于对不合理任务说“不”的人。当遭遇不公时，你未必会歇斯底里，但你的眼神和态度会筑起一道冰墙：“我可以不争，但不能不被尊重。”在这个随波逐流的时代，你活成了一座孤岛，但岛上有最坚固的灯塔。',
            blessing: '“尊严是你的边界，不必变成密不透风的盔甲；允许自己求助，不等于低头。”'
        },
        'C': {
            name: '默尔索',
            tag: '情绪真实 · 剧本拒绝型',
            quote: '“我知道这世界我无处容身，只是，你凭什么审判我的灵魂？”',
            scores: { detach: 98, order: 80, emotion: 30, rebel: 20, spirit: 60 },
            soul: '你不是冷血，你只是拒绝了社会强加给你的“情绪剧本”。当所有人都在为了合群表演并不存在的情绪时，你只觉得这一切滑稽且无趣。你拒绝撒谎，哪怕代价是被误解、被边缘化。你最珍贵的品质是“真实”，哪怕这种真实在这个时代显得有些冷漠。',
            reality: '面对群聊里的抱团吹捧、酒桌上的称兄道弟，你的内心毫无波澜，甚至想赶紧回家。你不愿意为了所谓的“合群”去假笑。在别人眼里，你显得过于理智或疏离；但对你来说，不表演、不逢迎，保持自己真实舒适的状态，就是最大的自洽。',
            blessing: '“抽离能保护你，但别让它变成彻底的隔绝。你可以不表演，也可以选择少量真实的连接。”'
        },
        'D': {
            name: '普鲁斯特',
            tag: '记忆反刍 · 审美沉浸型',
            quote: '“真正的发现之旅，不在于寻找新天地，而在于拥有新的眼光。”',
            scores: { detach: 70, order: 40, emotion: 85, rebel: 25, spirit: 95 },
            soul: '你的共情能力不具攻击性，像水一样安静地包裹着身边的人。你对山水、人事和情感都有细密感应，却常常只是等、听、藏。你不习惯用激烈的语言表达需求，总是把最好、最温柔的一面留给别人。你的记忆极其稠密，某个下午的光线，都能成为你精神宇宙的基石。',
            reality: '在朋友眼里，你是最靠谱的倾听者。你不会说漂亮的场面话，但会默默递纸巾、倒热水。遇到喜欢的人，你的第一反应是退缩和等待，心里上演了无数场百转千回，表面上却连一句“我很在意你”都不敢轻易说出口。',
            blessing: '“等待很动人，但需求也要练习说出口；你不说，别人不一定接得住你细密的温柔。”'
        }
    };

    let currentQIndex = 0;
    let userAnswers = [];

    // DOM 元素
    const views = {
        intro: document.getElementById('view-intro'),
        quiz: document.getElementById('view-quiz'),
        result: document.getElementById('view-result')
    };
    const qTitle = document.getElementById('questionTitle');
    const optList = document.getElementById('optionsList');
    const progText = document.getElementById('progressText');
    const progFill = document.getElementById('progressFill');

    // 切换视图
    function switchView(viewName) {
        Object.values(views).forEach(v => v.classList.remove('active'));
        views[viewName].classList.add('active');
        window.scrollTo(0, 0);
    }

    // 开始测试
    function startQuiz() {
        switchView('quiz');
        renderQuestion();
    }

    // 渲染题目
    function renderQuestion() {
        if (currentQIndex >= fullQuestions.length) {
            calculateResult();
            return;
        }
        
        const q = fullQuestions[currentQIndex];
        
        // 更新进度
        progText.innerText = `${(currentQIndex + 1).toString().padStart(2, '0')} / ${fullQuestions.length}`;
        progFill.style.width = `${((currentQIndex + 1) / fullQuestions.length) * 100}%`;

        // 渲染文字
        qTitle.innerText = q.q;
        
        // 渲染选项
        optList.innerHTML = '';
        q.o.forEach((text, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-item';
            // 映射 A B C D
            const letter = ['A', 'B', 'C', 'D'][index];
            btn.innerHTML = `<span style="font-family:var(--serif); color:var(--accent); margin-right:10px; font-weight:bold;">${letter}</span> ${text}`;
            btn.onclick = () => selectOption(letter);
            optList.appendChild(btn);
        });
    }

    // 选择选项
    function selectOption(letter) {
        userAnswers.push(letter);
        currentQIndex++;
        
        // 简单的淡入淡出效果
        views.quiz.style.opacity = '0';
        setTimeout(() => {
            renderQuestion();
            views.quiz.style.opacity = '1';
        }, 200);
    }

    // 计算并展示结果
    function calculateResult() {
        const counts = { A: 0, B: 0, C: 0, D: 0 };
        userAnswers.forEach(ans => counts[ans]++);
        
        let maxLetter = 'A';
        let maxCount = -1;
        for (const key in counts) {
            if (counts[key] > maxCount) {
                maxCount = counts[key];
                maxLetter = key;
            }
        }

        showResult(maxLetter);
    }

    function showResult(letter) {
        switchView('result');
        const data = resultsData[letter];

        // 填充文本
        document.getElementById('resName').innerText = data.name;
        document.getElementById('resTag').innerText = data.tag;
        document.getElementById('resQuote').innerText = data.quote;
        document.getElementById('resSoul').innerText = data.soul;
        document.getElementById('resReality').innerText = data.reality;
        document.getElementById('resBlessing').innerText = data.blessing;

        // 渲染列表数据
        const dataList = document.getElementById('dataList');
        dataList.innerHTML = '';
        
        dimensions.forEach(dim => {
            const score = data.scores[dim.key];
            const item = document.createElement('div');
            item.className = 'data-item';
            item.innerHTML = `
                <div class="data-header">
                    <span>${dim.label}</span>
                    <span class="data-score">${score}%</span>
                </div>
                <div class="data-desc">${dim.desc}</div>
            `;
            dataList.appendChild(item);
        });

        // 绘制雷达图
        drawRadarChart(data.scores);
    }

    // 绘制 SVG 雷达图
    function drawRadarChart(scores) {
        const svg = document.getElementById('radarSvg');
        svg.innerHTML = ''; // 清空
        
        const cx = 120, cy = 120, R = 80; // 中心点和半径
        const numAxes = 5;
        const angleStep = (Math.PI * 2) / numAxes;
        const startAngle = -Math.PI / 2; // 12点钟方向开始

        // 1. 画底部的蜘蛛网线 (正五边形，画3圈)
        for(let i=1; i<=3; i++) {
            const currentR = R * (i / 3);
            let points = [];
            for (let j = 0; j < numAxes; j++) {
                const angle = startAngle + j * angleStep;
                const x = cx + currentR * Math.cos(angle);
                const y = cy + currentR * Math.sin(angle);
                points.push(`${x},${y}`);
            }
            const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            polygon.setAttribute("points", points.join(" "));
            polygon.setAttribute("fill", "none");
            polygon.setAttribute("stroke", "#E6E2D8");
            polygon.setAttribute("stroke-width", "1");
            svg.appendChild(polygon);
        }

        // 2. 画轴线和文字
        const dimsInOrder = ['detach', 'order', 'emotion', 'rebel', 'spirit']; // 顺时针顺序
        const labels = ['现世抽离', '秩序壁垒', '情感浓度', '反叛张力', '精神潜游'];
        const textPos = 25; // 文字距离边缘的距离

        for (let j = 0; j < numAxes; j++) {
            const angle = startAngle + j * angleStep;
            const x = cx + R * Math.cos(angle);
            const y = cy + R * Math.sin(angle);
            
            // 轴线
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", cx);
            line.setAttribute("y1", cy);
            line.setAttribute("x2", x);
            line.setAttribute("y2", y);
            line.setAttribute("stroke", "#E6E2D8");
            line.setAttribute("stroke-width", "1");
            svg.appendChild(line);

            // 文字标签
            const textX = cx + (R + textPos) * Math.cos(angle);
            const textY = cy + (R + textPos) * Math.sin(angle);
            const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
            textEl.setAttribute("x", textX);
            textEl.setAttribute("y", textY);
            textEl.setAttribute("text-anchor", "middle");
            textEl.setAttribute("dominant-baseline", "middle");
            textEl.setAttribute("fill", "#66615B");
            textEl.setAttribute("font-size", "11");
            textEl.setAttribute("font-family", "var(--sans)");
            textEl.textContent = labels[j];
            
            // 微调文字位置防止重叠
            if (j === 0) textEl.setAttribute("y", parseInt(textY) - 5);
            if (j === 2) textEl.setAttribute("x", parseInt(textX) + 15);
            if (j === 3) textEl.setAttribute("x", parseInt(textX) + 15);
            
            svg.appendChild(textEl);
        }

        // 3. 画用户数据区域
        let userPoints = [];
        for (let j = 0; j < numAxes; j++) {
            const dimKey = dimsInOrder[j];
            const score = scores[dimKey] / 100;
            const currentR = R * score;
            const angle = startAngle + j * angleStep;
            const x = cx + currentR * Math.cos(angle);
            const y = cy + currentR * Math.sin(angle);
            userPoints.push(`${x},${y}`);
        }

        // 数据填充多边形
        const dataPolygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        dataPolygon.setAttribute("points", userPoints.join(" "));
        dataPolygon.setAttribute("fill", "rgba(156, 90, 76, 0.15)"); // 半透明朱砂红
        dataPolygon.setAttribute("stroke", "#9C5A4C"); // 朱砂红
        dataPolygon.setAttribute("stroke-width", "1.5");
        
        // 动画效果
        dataPolygon.style.opacity = 0;
        dataPolygon.style.transition = "opacity 1s ease 0.3s";
        svg.appendChild(dataPolygon);
        
        // 数据点圆点
        userPoints.forEach(pointStr => {
            const [x, y] = pointStr.split(',');
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", "3");
            circle.setAttribute("fill", "#9C5A4C");
            
            circle.style.opacity = 0;
            circle.style.transition = "opacity 1s ease 0.5s";
            svg.appendChild(circle);
        });

        // 触发动画
        setTimeout(() => {
            dataPolygon.style.opacity = 1;
            svg.querySelectorAll('circle').forEach(c => c.style.opacity = 1);
        }, 100);
    }
</script>

</body>
</html>
